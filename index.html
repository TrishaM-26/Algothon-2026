*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1040px;margin-inline:auto}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.9rem;letter-spacing:-.01em;font-weight:650}
h2{font-size:1.2rem;font-weight:650}
h3{font-size:1rem;font-weight:650}
p{margin:0}
.sub{color:var(--ink2);max-width:68ch}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
header.top{padding-block:28px 18px;display:flex;flex-direction:column;gap:8px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
nav .row{max-width:1040px;margin-inline:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);font:inherit;font-weight:600;padding:12px 12px 10px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}
section.tab{display:flex;flex-direction:column;gap:26px;padding-top:26px}
section.tab[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.card.plain{padding:0;border:0;background:none}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.hero h2{font-size:1.5rem;letter-spacing:-.01em}
.facts{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);padding-left:20px}

svg.chart{width:100%;height:auto;display:block;overflow:visible}

svg text.t2{fill:var(--ink2)}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.btn:hover{background:var(--hover);color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{color:var(--ink2);font-weight:600;text-align:left;font-size:.78rem;padding:6px 10px 6px 0;border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:.82rem}

.pill svg{width:12px;height:12px}
.bar{height:10px;border-radius:2px;background:var(--s1);min-width:2px}
.bar.o{background:var(--s2)}
.bars{display:flex;flex-direction:column;gap:3px;min-width:120px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.bar-row span{font-size:.78rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.tag{font-size:.68rem;border:1px solid var(--axis);border-radius:4px;padding:0 5px;color:var(--ink2);margin-left:6px;white-space:nowrap}
.note{font-size:.85rem;color:var(--ink2);max-width:75ch}
.callout{border-left:3px solid var(--s2);padding:4px 0 4px 14px;max-width:75ch}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.heat td{padding:0;border:0}
.heat th{padding:4px 6px;text-align:center}
.heat td.c{height:30px;min-width:46px;text-align:center;font-size:.74rem;font-variant-numeric:tabular-nums;border:2px solid var(--surface)}
.heat td.rl{padding-right:10px;white-space:nowrap;font-size:.8rem}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.finding .k{font-weight:650;white-space:nowrap}

#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:.8rem;box-shadow:0 4px 18px rgba(0,0,0,.16);max-width:260px;display:none}
#tip b{display:block;margin-bottom:3px}
#tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}

.tl{position:relative;height:150px;margin-top:6px}
.tl .m{position:absolute;top:0;bottom:22px;border-left:1px solid var(--grid);font-size:.68rem;color:var(--muted);padding-left:3px}

.tl .tr{background:var(--band);border:1px solid var(--s1)}

function lines(host, o) {
  const W = o.W || 720, Hh = o.h || 230, f = frame(host, W, Hh, { l: 46, r: 12, t: 12, b: 34 }), n = o.labels.length;
  const ymax = o.ymax, ys = yAxis(f.svg, f, 0, ymax, 3, o.yfmt), step = f.iw / n, xs = i => f.l + step * i + step / 2;
  if (o.band) el('rect', { x: f.l + step * o.band[0], width: step * (o.band[1] - o.band[0] + 1), y: f.t, height: f.ih, fill: 'var(--band)' }, f.svg);
  o.series.forEach(s => {
    el('path', { d: s.values.map((v, i) => (i ? 'L' : 'M') + xs(i) + ' ' + ys(v)).join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, f.svg);
  });
  const cross = el('line', { y1: f.t, y2: f.t + f.ih, stroke: 'var(--axis)', 'stroke-width': 1, opacity: 0 }, f.svg);
  const dots = o.series.map(s => el('circle', { r: 4.5, fill: s.color, stroke: 'var(--surface)', 'stroke-width': 2, opacity: 0 }, f.svg));
  o.labels.forEach((lb, i) => {
    const t = el('text', { x: xs(i), y: Hh - 16, 'text-anchor': 'middle' }, f.svg); t.textContent = lb;
    if (o.years && o.years[i]) { const y = el('text', { x: xs(i), y: Hh - 3, 'text-anchor': 'middle', class: 't2' }, f.svg); y.textContent = o.years[i]; }
    const hit = el('rect', { x: f.l + step * i, y: f.t, width: step, height: f.ih + 30, fill: 'transparent' }, f.svg);
    hit.addEventListener('pointermove', ev => { cross.setAttribute('x1', xs(i)); cross.setAttribute('x2', xs(i)); cross.setAttribute('opacity', 1);
      dots.forEach((d, k) => { d.setAttribute('cx', xs(i)); d.setAttribute('cy', ys(o.series[k].values[i])); d.setAttribute('opacity', 1); }); showTip(o.tip(i), ev); });
    hit.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); hideTip(); });
  });
  f.svg.setAttribute('aria-label', o.aria);
}

/* x-y chart on 0..1 axes (ROC, Lorenz) */
function xy(host, o) {
  const W = 480, Hh = 400, f = frame(host, W, Hh, { l: 46, r: 12, t: 12, b: 44 });
  const ys = yAxis(f.svg, f, 0, 1, 4, v => pc(v)), xs = v => f.l + v * f.iw;
  for (let i = 0; i <= 4; i++) { const t = el('text', { x: xs(i / 4), y: f.t + f.ih + 16, 'text-anchor': 'middle' }, f.svg); t.textContent = pc(i / 4); }
  const xt = el('text', { x: f.l + f.iw / 2, y: Hh - 4, 'text-anchor': 'middle', class: 't2' }, f.svg); xt.textContent = o.xlabel;
  const yt = el('text', { x: 0, y: 0, transform: `translate(11 ${f.t + f.ih / 2}) rotate(-90)`, 'text-anchor': 'middle', class: 't2' }, f.svg); yt.textContent = o.ylabel;
  el('line', { x1: xs(0), y1: ys(0), x2: xs(1), y2: ys(1), stroke: 'var(--muted)', 'stroke-dasharray': '4 4', 'stroke-width': 1 }, f.svg);
  o.series.forEach(s => el('path', { d: s.pts.map((p, i) => (i ? 'L' : 'M') + xs(p[0]) + ' ' + ys(p[1])).join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-dasharray': s.dash || '', 'stroke-linejoin': 'round' }, f.svg));
  const cross = el('line', { y1: f.t, y2: f.t + f.ih, stroke: 'var(--axis)', opacity: 0 }, f.svg);
  const hit = el('rect', { x: f.l, y: f.t, width: f.iw, height: f.ih, fill: 'transparent' }, f.svg);
  const at = (pts, x) => { let b = pts[0]; for (const p of pts) if (Math.abs(p[0] - x) < Math.abs(b[0] - x)) b = p; return b; };
  hit.addEventListener('pointermove', ev => {
    const r = f.svg.getBoundingClientRect(), x = Math.min(1, Math.max(0, ((ev.clientX - r.left) / r.width * W - f.l) / f.iw));
    cross.setAttribute('x1', xs(x)); cross.setAttribute('x2', xs(x)); cross.setAttribute('opacity', 1);
    showTip(o.tip(x, o.series.map(s => ({ s, p: at(s.pts, x) }))), ev);
  });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
  f.svg.setAttribute('aria-label', o.aria);
}

    <li>The top movers mix Christmas lines with winter and gift items such as hot water bottles, hand warmers and night lights.</li></ul>
    <div class="stack" style="gap:6px;margin-top:4px"><span class="eyebrow">Largest monthly gains, Sep-Nov vs Jun-Aug</span>
    ${mv.map(m => `<div class="bar-row" style="grid-template-columns:minmax(0,210px) minmax(0,1fr) auto"><span style="color:var(--ink)">${m.item}${XM.test(m.item) ? '<span class="tag">Christmas</span>' : ''}</span><div class="bar" style="width:${m.uplift / mx * 100}%"></div><span>${gbp(m.uplift)}</span></div>`).join('')}</div>
  </div>
  <div class="card stack">
    <div class="ctitle"><h3>H3. ${H_('H3')}</h3>${verdict(R.hypotheses[2].verdict)}</div>
    <p>${num(e3.returning_in_q4)} of the ${num(e3.summer_customers)} customers who ordered in summer ordered again in Sep-Nov (${pc(e3.returning_share)}). Their spend rose ${pc(e3.same_customer_growth)}. Customers who skipped summer account for ${pc(e3.q4_rev_share_from_customers_absent_in_summer)} of Sep-Nov revenue.</p>
    <p class="note">Split of the extra monthly revenue by customer type: continuing ${pc(XS.continuing)}, reactivated ${pc(XS.reactivated)}, new ${pc(XS.new)}. My first guess was that reactivated customers drove the lift. The split shows they grow fastest in percentage terms but from a small base, so continuing customers supply most of the extra revenue.</p>
  </div>`;
}
function H_(id) { return R.hypotheses.find(h => h.id === id).claim; }

function model() {
  const m = R.model, res = m.results, names = Object.keys(res), best = m.best;
  const col = { 'Baseline: recency only': 'var(--muted)', 'Logistic regression': 'var(--s1)', 'Gradient boosting': 'var(--s2)' };
  const imp = m.importance.slice(0, 7), mx = Math.max(...imp.map(i => i.drop));
  const lab = { tenure: 'Days since first order', inv_last_90: 'Orders in last 90 days', recency: 'Days since last order', mean_gap: 'Mean days between orders', n_products: 'Distinct products bought', n_returns: 'Number of returns', frequency: 'Total orders', monetary: 'Total spend', avg_order: 'Average order value', rev_last_90: 'Spend in last 90 days', uk: 'UK customer', return_ratio: 'Returned share of spend', aov_trend: 'Order value trend' };
  const span = (a, b) => { const t0 = new Date('2010-12-01'), t1 = new Date('2011-12-31'), d = x => (new Date(x) - t0) / (t1 - t0) * 100; return [d(a), d(b) - d(a)]; };
  const days = (d, n) => new Date(new Date(d).getTime() + n * 864e5).toISOString().slice(0, 10);
  const trSp = m.train_cutoffs.map((c, i) => { const [l, w] = span(c, days(c, m.horizon_days)); return `<div class="w lb" style="left:${l}%;width:${w}%;top:${24 + i * 20}px">label window ${i + 1}</div>`; }).join('');
  const [tl, tw] = span(m.test_cutoff, '2011-12-09');
  secs.model.innerHTML = `
  <div class="stack"><h2>Which customers stop ordering?</h2>
  <p class="sub">The question: for a customer we have seen so far, will they place no order in the next ${m.horizon_days} days? Features use only history before a snapshot date. The label looks ${m.horizon_days} days ahead.</p></div>
  <div class="card stack"><h3>Time-based validation</h3>
    <p class="note">Models train on four earlier snapshots and are scored on one later snapshot whose label window they never saw. A random split would let a model learn from the future, so none is used. The last training label window ends before the test snapshot (checked by an assertion in the code).</p>
    <div class="tl">${[['2010-12-01', 'Dec 10'], ['2011-03-01', 'Mar'], ['2011-06-01', 'Jun'], ['2011-09-01', 'Sep'], ['2011-12-01', 'Dec 11']].map(([d, t]) => { const [l] = span(d, d); return `<div class="m" style="left:${l}%">${t}</div>`; }).join('')}
      ${trSp}<div class="w tr" style="left:${tl}%;width:${tw}%;top:24px">test label window</div>
      <div class="w" style="left:${span(m.test_cutoff, m.test_cutoff)[0]}%;top:48px;padding:0;color:var(--ink2)">▲ test snapshot ${m.test_cutoff}</div></div>
    <p class="note">${num(m.train_rows)} training rows from four snapshots, ${num(m.test_rows)} test rows. Churn rate ${pc(m.train_churn_rate)} in training and ${pc(m.test_churn_rate)} in test.</p>
  </div>
  <div class="grid2">
    <div class="card stack"><h3>Held-out results</h3>
      <div class="scroll"><table><thead><tr><th>Model</th><th class="n">ROC AUC</th><th class="n">PR AUC</th><th class="n">Top-10% lift</th></tr></thead><tbody>
      ${names.map(n => `<tr><td><span class="legend"><span><i class="ln" style="background:${col[n]}"></i>${n}</span></span></td><td class="n">${res[n].roc_auc.toFixed(3)}<br><span class="note">${res[n].auc_ci[0].toFixed(2)}-${res[n].auc_ci[1].toFixed(2)}</span></td><td class="n">${res[n].pr_auc.toFixed(3)}</td><td class="n">${res[n].top_decile_lift.toFixed(2)}x</td></tr>`).join('')}</tbody></table></div>
      <p class="note">Intervals are 95% bootstrap over test customers. Both models beat the recency rule by ${res['Logistic regression'].gain_vs_baseline.toFixed(3)} and ${res['Gradient boosting'].gain_vs_baseline.toFixed(3)} AUC, and both gain intervals exclude zero. Logistic and boosting are statistically tied (gap interval ${R.lr_vs_gbm_gap_ci[0].toFixed(3)} to ${R.lr_vs_gbm_gap_ci[1].toFixed(3)}). Top-10% lift is capped near ${(1 / m.test_churn_rate).toFixed(1)}x here because ${pc(m.test_churn_rate)} of customers churn.</p></div>
    <div class="card stack"><h3>ROC curves</h3>
      <div class="legend">${names.map(n => `<span><i class="ln" style="background:${col[n]}"></i>${n}</span>`).join('')}</div><div id="c-roc"></div></div>
  </div>
  <div class="grid2">
    <div class="card stack"><h3>What drives the prediction</h3><p class="note">Drop in held-out AUC when one feature is shuffled (${best}).</p>
      ${imp.map(i => `<div class="bar-row" style="grid-template-columns:minmax(0,170px) minmax(0,1fr) auto"><span style="color:var(--ink)">${lab[i.feature] || i.feature}</span><div class="bar" style="width:${Math.max(i.drop, 0) / mx * 100}%"></div><span>${i.drop.toFixed(3)}</span></div>`).join('')}
      <p class="note">Customer age and recent activity matter most. Return behaviour adds little.</p></div>
    <div class="card stack"><h3>Calibration on the test period</h3>
      <div class="legend"><span><i style="background:var(--s1)"></i>Predicted</span><span><i style="background:var(--s2)"></i>Actual</span></div>
      ${m.calibration.map((c, i) => `<div class="bars"><span class="note">Risk quintile ${i + 1} (${num(c.n)} customers)</span><div class="bar-row"><div class="bar" style="width:${c.pred * 100}%"></div><span>${pc(c.pred)}</span></div><div class="bar-row"><div class="bar o" style="width:${c.actual * 100}%"></div><span>${pc(c.actual)}</span></div></div>`).join('')}
      <p class="note">Ranking is useful. The probabilities run too low for safe customers and too high for risky ones, so use the score to rank, not as a literal chance.</p></div>
  </div>
  <div class="card stack"><h3>Repeat buyers most worth a call this week</h3>
    <p class="note">Model refit on all snapshots and scored at ${R.date_range[1]}. The pool is the ${num(R.at_risk_pool)} repeat buyers who ordered in the last 150 days. Value at risk is churn probability times past spend. Total across the pool: ${gbp(R.at_risk_total_value)}. The full list is in at_risk_customers.csv.</p>
    <div class="scroll"><table><thead><tr><th>Customer</th><th>Segment</th><th class="n">Past spend</th><th class="n">Orders</th><th class="n">Days since last</th><th>Churn risk</th><th class="n">Value at risk</th></tr></thead><tbody>
    ${R.at_risk.map(a => `<tr><td class="mono">${a.customer}</td><td>${a.segment}</td><td class="n">${gbp(a.monetary)}</td><td class="n">${a.frequency}</td><td class="n">${a.recency}</td><td><div class="bar-row"><div class="bar o" style="width:${a.churn_prob * 100}%"></div><span>${pc(a.churn_prob)}</span></div></td><td class="n">${gbp(a.churn_prob * a.monetary)}</td></tr>`).join('')}</tbody></table></div></div>`;
  xy($('#c-roc'), { xlabel: 'False positive rate', ylabel: 'True positive rate', aria: 'ROC curves for three churn models; logistic regression and gradient boosting sit above the recency baseline.',
    series: names.map(n => ({ name: n, color: col[n], dash: n.startsWith('Baseline') ? '5 4' : '', pts: m.roc[n] })),
    tip: (x, a) => `<b>False positive rate ${pc(x)}</b>${a.map(r => row(col[r.s.name], r.s.name, pc(r.p[1]))).join('')}` });
}

function method() {
  secs.method.innerHTML = `
  <div class="stack"><h2>How it was built, and where it breaks</h2></div>
  <div class="card stack"><h3>Architecture</h3>
<div class="flow">
    <div class="fc"><div class="fb"><b>Online_Retail.xlsx</b><span>541,909 raw rows</span></div></div><div class="fa">→</div>
    <div class="fc"><div class="fb"><b>Clean</b><span>6 counted rules, writes clean_sales.csv</span></div></div><div class="fa">→</div>
    <div class="fc"><div class="fb"><b>Explore</b><span>customer types, cohorts, RFM, anomalies</span></div><div class="fb"><b>Test hypotheses</b><span>Mann-Whitney, bootstrap</span></div><div class="fb"><b>Churn model</b><span>snapshot features, time split, logistic and boosting</span></div></div><div class="fa">→</div>
    <div class="fc"><div class="fb"><b>results.json</b><span>feeds this dashboard</span></div><div class="fb"><b>at_risk_customers.csv</b><span>scored customers</span></div></div>
  </div></div>
  <div class="grid2">
    <div class="card stack"><h3>Decisions that change the numbers</h3><ul class="clean">
      <li>Matched order and cancellation pairs are removed from sales, not counted as returns. Unmatched cancellations stay as returns.</li>
      <li>Guest orders stay in revenue totals and leave customer-level analysis, since they have no identity to follow.</li>
      <li>The model's label is "no order within ${R.model.horizon_days} days", chosen so one snapshot is not dominated by the pre-Christmas rush.</li>
      <li>Regression and boosting were compared on the held-out snapshot. Their gap is within noise, so the simpler logistic model is reported as the main model.</li></ul></div>
    <div class="card stack"><h3>Known limitations</h3><ul class="clean">
      <li>One year of data. Seasonality cannot be learned, so the test period includes the Q4 peak and its base rate differs from training.</li>
      <li>Exact-quantity matching misses partial cancellations. Those stay in as returns.</li>
      <li>The Christmas keyword list is a lower bound on seasonal stock.</li>
      <li>Model selection saw the test snapshot. With three candidates and a tie at the top, the effect is small, but it is not a clean final exam.</li>
      <li>The at-risk list scores recent repeat buyers only. Customers silent for months are outside the training range.</li>
      <li>Nothing here is causal. The findings describe this retailer in this year.</li></ul></div>
  </div>
  <div class="grid2">
    <div class="card stack"><h3>Testing and edge cases</h3><ul class="clean">
      <li>tests.py checks that the cleaning log reconciles to the raw row count, no duplicates or negative quantities remain, and matched reversals net to zero.</li>
      <li>tests.py checks that no training label window reaches the test snapshot and that all probabilities lie in 0 to 1.</li>
      <li>Edge cases handled: 25% missing customer IDs, duplicate rows, non-product codes, same-day reversals, a partial final month, single-order customers (gap feature), and customers with zero prior returns.</li></ul></div>
    <div class="card stack"><h3>Disclosure</h3><ul class="clean">
      <li>Dataset: the supplied Online_Retail.xlsx (the public UCI Online Retail data). No other data or external APIs.</li>
      <li>Libraries: pandas, NumPy, SciPy, scikit-learn.</li>
      <li>AI-assisted: this analysis and dashboard were drafted with Claude. Every figure comes from the pipeline output and can be regenerated with <span class="mono">python pipeline.py</span>.</li></ul></div>
  </div>`;
}

overview(); cleaning(); customers(); hypotheses(); model(); method();

</script>
